{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h3><i class="bi bi-person-gear"></i> Edit Profile</h3>

<form method="post" class="row g-3 bg-white p-4 rounded shadow-sm">
  <div class="col-md-6">
    <label class="form-label">Full Name</label>
    <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ current_user.email }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Contact</label>
    <input type="text" name="contact" class="form-control" value="{{ current_user.contact or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Username (cannot change)</label>
    <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
  </div>

  <hr>
  <h5>Change Password (optional)</h5>
  <div class="col-md-6">
    <label class="form-label">Old Password</label>
    <input type="password" name="old_password" class="form-control">
  </div>
  <div class="col-md-6">
    <label class="form-label">New Password</label>
    <input type="password" name="new_password" class="form-control">
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Save Changes</button>
  </div>
</form>
{% endblock %}
